name: coolify

services:
  coolify:
    image: coollabsio/coolify:${COOLIFY_VERSION:-4.7.5}
    container_name: coolify
    restart: unless-stopped
    working_dir: /var/www/html
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file: .env
    environment:
      APP_ENV: production
      APP_ID: ${APP_ID:?Defina APP_ID no .env}
      APP_KEY: ${APP_KEY:?Defina APP_KEY no .env}
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-10.0.0.4}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-coolify}
      DB_USERNAME: ${DB_USERNAME:-coolify}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      REDIS_HOST: coolify-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env}
      PUSHER_APP_ID: ${PUSHER_APP_ID:?Defina PUSHER_APP_ID no .env}
      PUSHER_APP_KEY: ${PUSHER_APP_KEY:?Defina PUSHER_APP_KEY no .env}
      PUSHER_APP_SECRET: ${PUSHER_APP_SECRET:?Defina PUSHER_APP_SECRET no .env}
      PUSHER_BACKEND_PORT: '6001'
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ${COOLIFY_DATA_DIR:-/data/coolify}/ssh:/var/www/html/storage/app/ssh
      - ${COOLIFY_DATA_DIR:-/data/coolify}/applications:/var/www/html/storage/app/applications
      - ${COOLIFY_DATA_DIR:-/data/coolify}/databases:/var/www/html/storage/app/databases
      - ${COOLIFY_DATA_DIR:-/data/coolify}/services:/var/www/html/storage/app/services
      - ${COOLIFY_DATA_DIR:-/data/coolify}/backups:/var/www/html/storage/app/backups
      - ${COOLIFY_DATA_DIR:-/data/coolify}/images:/var/www/html/storage/app/images
    ports:
      - '${COOLIFY_BIND_IP:-127.0.0.1}:${APP_PORT:-8000}:8080'
      - '${COOLIFY_BIND_IP:-127.0.0.1}:${REVERB_PORT:-6001}:6001'
      - '${COOLIFY_BIND_IP:-127.0.0.1}:${TERMINAL_PORT:-6002}:6002'
    networks:
      coolify:
        aliases:
          - coolify-realtime
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:8080/api/health && curl -fsS http://127.0.0.1:6001/up']
      interval: 10s
      timeout: 2s
      retries: 12
      start_period: 1m

  redis:
    image: redis:7-alpine
    container_name: coolify-redis
    restart: unless-stopped
    command: [redis-server, --save, '20', '1', --loglevel, warning, --requirepass, '${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env}']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env}
    volumes:
      - redis_data:/data
    networks:
      - coolify
    healthcheck:
      test: [CMD-SHELL, 'redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  redis_data:

networks:
  coolify:
    name: coolify
