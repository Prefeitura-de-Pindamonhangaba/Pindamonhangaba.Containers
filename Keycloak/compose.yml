name: keycloak

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U keycloak -d keycloak']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    shm_size: 128mb

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: [start]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Defina KC_BOOTSTRAP_ADMIN_PASSWORD no .env}
      KC_HOSTNAME: ${KC_HOSTNAME:-https://localhost:8081}
      KC_HOSTNAME_STRICT: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/tls/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/tls/server.key
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_CACHE: local
      KC_DB_POOL_INITIAL_SIZE: '5'
      KC_DB_POOL_MIN_SIZE: '5'
      KC_DB_POOL_MAX_SIZE: '20'
    ports:
      - '${KC_BIND_ADDRESS:-127.0.0.1}:${KC_HTTP_PORT:-8081}:8443'
    volumes:
      - ./tls:/opt/keycloak/conf/tls:ro,Z
      - ./themes:/opt/keycloak/themes:ro,Z
    networks:
      - database
      - frontend
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 60s

volumes:
  postgres_data:

networks:
  database:
    internal: true
  frontend:
