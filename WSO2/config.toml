[analytics]
enabled = false

[router]
gateway_host = "*"

[router.access_logs]
enabled = true

[controller.storage]
type = '{{ env "APIP_GW_CONTROLLER_STORAGE_TYPE" "sqlite" }}'

[controller.storage.sqlite]
path = "./data/gateway.db"

[controller.storage.postgres]
host = '{{ env "APIP_GW_CONTROLLER_STORAGE_POSTGRES_HOST" "" }}'
port = '{{ env "APIP_GW_CONTROLLER_STORAGE_POSTGRES_PORT" "5432" }}'
database = '{{ env "APIP_GW_CONTROLLER_STORAGE_POSTGRES_DATABASE" "gateway_controller" }}'
user = '{{ env "APIP_GW_CONTROLLER_STORAGE_POSTGRES_USER" "gateway" }}'
password = '{{ env "APIP_GW_CONTROLLER_STORAGE_POSTGRES_PASSWORD" "" }}'
sslmode = '{{ env "APIP_GW_CONTROLLER_STORAGE_POSTGRES_SSLMODE" "verify-full" }}'

[controller.controlplane]
host = '{{ env "APIP_GW_CONTROLLER_CONTROLPLANE_HOST" "connect.bijira.dev" }}'
token = '{{ env "APIP_GW_CONTROLLER_CONTROLPLANE_TOKEN" "" }}'
insecure_skip_verify = false

[controller.policies]
definitions_path = "./default-policies"

[controller.auth.basic]
enabled = true

[[controller.auth.basic.users]]
username = "admin"
password = '{{ env "APIP_GW_CONTROLLER_AUTH_BASIC_ADMIN_PASSWORD_HASH" "" }}'
password_hashed = true
roles = ["admin"]
